title: Masquerading MySQL Binary Outside Install Directory
id: a0e72bfb-1bce-4a30-9bf5-60c341c3d292
status: experimental
description: Fires on a file named mysqld.exe running from outside the MySQL install directory. Does not identify whether that file is malicious.
references:
    - https://attack.mitre.org/techniques/T1036/005/
author: Raynard Waits
date: 2026-08-09
tags:
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mysqld.exe'
    filter:
        Image|startswith:
            - 'C:\Program Files\MySQL\'
            - 'C:\Program Files (x86)\MySQL\'
    condition: selection and not filter
falsepositives:
    - XAMPP, WAMP, or MAMP development stacks, which install MySQL outside Program Files
    - Applications shipping an embedded MySQL instance inside their own program directory
    - MySQL installed to a non-C drive or a custom directory
level: medium
